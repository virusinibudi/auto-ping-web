name: Auto Ping & Notifikasi Telegram

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Eksekusi Kunjungan & Kirim Notifikasi
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          WEBSITES=(
            "http://siresi.xo.je"
            "http://ppob.xo.je"
            "http://saham.xo.je"
            "http://jknhero.xo.je"
            "http://multilog.xo.je"
            "http://eliteclub.xo.je"
          )

          for WEB in "${WEBSITES[@]}"; do
            (
              JEDA=$(( RANDOM % 14400 ))
              sleep $JEDA
              
              STATUS=$(curl -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64)" -o /dev/null -s -w "%{http_code}" -L $WEB)
              
              if [ "$STATUS" -eq 200 ]; then
                PESAN="✅ [$STATUS OK] Kunjungan harian ke $WEB berhasil!"
                # Mengirim pesan ke Telegram
                curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" -d chat_id="${TELEGRAM_CHAT_ID}" -d text="$PESAN" > /dev/null
              fi
            ) &
          done

          wait
